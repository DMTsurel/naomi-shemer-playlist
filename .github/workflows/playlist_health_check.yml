name: Weekly YouTube Playlist Health Check & Auto-Heal

on:
  schedule:
    # Runs every Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  health-check-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run playlist health check & auto-heal
        run: |
          python3 check_and_heal_playlist.py
          python3 export_streaming_and_wayback.py

      - name: Check for healed or modified files
        id: git_diff
        run: |
          if [ -n "$(git status --porcelain naomi_shemer_youtube_playlist.json index.html naomi_shemer_playlist_player.html)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push healed playlist files
        if: steps.git_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naomi_shemer_youtube_playlist.json naomi_shemer_youtube_playlist.csv naomi_shemer_youtube_playlist.md \
                  create_playlist_in_browser.js update_existing_playlist_in_browser.js \
                  naomi_shemer_playlist_player.html index.html \
                  youtube_full_metadata_backup.json health_check_report.md \
                  naomi_shemer_streaming_import.csv naomi_shemer_youtube_stream.m3u8 wayback_backup_urls.txt
          git commit -m "chore(auto-heal): replace unavailable YouTube video(s) with healthy backup"
          git push

      - name: Open GitHub Issue with Health Report on Changes
        if: steps.git_diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🛡️ התראת גיבוי אוטומטי: הוחלפו סרטונים שנמחקו בפלייליסט נעמי שמר" \
            --body-file health_check_report.md
