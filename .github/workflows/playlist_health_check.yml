name: Weekly YouTube Playlist Health Check & Auto-Heal

on:
  schedule:
    # Runs every Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Discover enabled composer slugs
        id: set-matrix
        run: |
          MATRIX_JSON=$(python3 scripts/cli.py matrix-json)
          echo "matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  health-check-and-heal:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        slug: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run playlist health check & auto-heal
        run: |
          python3 scripts/cli.py heal "${{ matrix.slug }}"

      - name: Check for healed or modified files
        id: git_diff
        run: |
          if [ -n "$(git status --porcelain -- "${{ matrix.slug }}" index.html)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push healed playlist files
        if: steps.git_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html "${{ matrix.slug }}/"
          git commit -m "chore(auto-heal): replace unavailable YouTube video(s) for ${{ matrix.slug }}"
          git pull --rebase
          git push

      - name: Open GitHub Issue with Health Report on Changes
        if: steps.git_diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🛡️ התראת גיבוי אוטומטי (${{ matrix.slug }}): הוחלפו סרטונים שנמחקו בפלייליסט" \
            --body-file "${{ matrix.slug }}/health_check_report.md"
